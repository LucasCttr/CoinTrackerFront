<!-- Main Content -->
<div class="dashboard-container">
  
  <!-- HEADER CON BOTÓN DE REFRESH -->
  <div class="dashboard-header">
    <h1>Top Cryptocurrencies</h1>
  </div>

  <!-- LOADING STATE -->

  <!-- ERROR STATE -->

  <!-- SUCCESS STATE - CRYPTO GRID -->
  <div *ngIf="!error && ((coins$ | async)?.length ?? 0) > 0" class="crypto-grid">
    
    <mat-card 
      *ngFor="let coin of coins$ | async; trackBy: trackByCoinId" 
      class="crypto-card">
      
      <mat-card-header>
        <!-- IMAGEN REAL DE LA CRYPTO -->
        <img 
          mat-card-avatar 
          [src]="coin.image" 
          [alt]="coin.name"
          class="crypto-avatar">
        
        <!-- USAR CAMPOS CORRECTOS -->
        <mat-card-title>{{ coin.name }}</mat-card-title>
        <mat-card-subtitle>{{ coin.symbolUppercase }}</mat-card-subtitle>
        
        <!-- RANKING -->
        <div class="ranking-badge" *ngIf="coin.marketCapRank">
          #{{ coin.marketCapRank }}
        </div>
      </mat-card-header>
      
      <mat-card-content>
        <!-- PRECIO FORMATEADO (YA NO USAS coin.price) -->
        <div class="price">{{ coin.formattedPrice }}</div>
        
        <!-- CAMBIO PORCENTUAL FORMATEADO (YA NO USAS coin.change) -->
        <div 
          class="change"
          [ngClass]="coin.priceChangeClass">
          {{ coin.formattedPercentage }}
        </div>
        
        <!-- INFO ADICIONAL (OPCIONAL) -->
        <div class="additional-info" *ngIf="coin.marketCap">
          <small>Market Cap: {{ coin.marketCap | currency:'USD':'symbol':'1.0-0' }}</small>
        </div>
      </mat-card-content>
      
      <!-- ACCIONES (OPCIONAL) -->
      <mat-card-actions align="end">
        <button mat-button (click)="onCoinClick(coin)">
          VER DETALLES
        </button>
      </mat-card-actions>
      
    </mat-card>
    
  </div>

  <!-- NO DATA STATE -->
  <div *ngIf="!error && (coins$ | async)?.length === 0" class="no-data-container">
    <mat-icon>info</mat-icon>
    <p>No hay datos de cryptocurrencies disponibles</p>
  </div>

</div>
