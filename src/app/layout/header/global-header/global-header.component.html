<mat-toolbar class="crypto-header">
  
  <!-- ========================================
       LOGO Y TÍTULO
       ======================================== -->
  <div class="header-brand" (click)="navigateHome()">
    <mat-icon class="brand-icon">currency_bitcoin</mat-icon>
    <span class="brand-text">CoinTracker</span>
  </div>

  <!-- ========================================
       🔥 NAVEGACIÓN - SOLO SI ESTÁ LOGUEADO
       ======================================== -->
  <div *ngIf="isAuthenticated" class="header-nav">
    <button mat-button (click)="navigateToMarket()" class="nav-button">
      <mat-icon>trending_up</mat-icon>
      <span>Mercado</span>
    </button>
    
    <button mat-button (click)="navigateToPortfolio()" class="nav-button">
      <mat-icon>account_balance_wallet</mat-icon>
      <span>Portfolio</span>
    </button>
  </div>

  <!-- SPACER PARA EMPUJAR CONTENIDO A LA DERECHA -->
  <span class="spacer"></span>

  <!-- ========================================
       🔥 ESTADO: NO AUTENTICADO - BOTÓN LOGIN
       ======================================== -->
  <div *ngIf="!isAuthenticated" class="auth-section">
    <button 
      mat-raised-button 
      color="primary" 
      (click)="openAuthModal()"
      [disabled]="isLoading"
      class="login-button">
      
      <!-- ÍCONOS DINÁMICOS -->
      <mat-icon *ngIf="isLoading">hourglass_empty</mat-icon>
      <mat-icon *ngIf="!isLoading">login</mat-icon>
      
      <!-- TEXTO DINÁMICO -->
      <span>{{ isLoading ? 'Cargando...' : 'Iniciar Sesión' }}</span>
    </button>
  </div>

  <!-- ========================================
       🔥 ESTADO: AUTENTICADO - USUARIO + MENÚ
       ======================================== -->
  <div *ngIf="isAuthenticated && currentUser" class="user-section">
    
    <!-- SALUDO CON NOMBRE DEL USUARIO -->
    <div class="user-welcome">
      <span class="welcome-text">Hola, </span>
      <span class="user-name-display">{{ userName }}</span>
    </div>
    
    <!-- BOTÓN DE MENÚ PEQUEÑO -->
    <button 
      mat-icon-button 
      [matMenuTriggerFor]="userMenu"
      class="user-menu-button"
      matTooltip="Opciones de usuario">
      <mat-icon>more_vert</mat-icon>
    </button>

    <!-- ========================================
         MENÚ DESPLEGABLE COMPACTO
         ======================================== -->
    <mat-menu #userMenu="matMenu" class="user-menu">
      
      <!-- INFORMACIÓN DEL USUARIO -->
      <div class="menu-user-info" mat-menu-item disabled>
        <div class="menu-avatar">
          <mat-icon>account_circle</mat-icon>
        </div>
        <div class="menu-details">
          <div class="menu-name">{{ userName }}</div>
          <div class="menu-email">{{ userEmail }}</div>
        </div>
      </div>
      
      <!-- SEPARADOR -->
      <mat-divider></mat-divider>
      
      <!-- OPCIONES RÁPIDAS -->
      <button mat-menu-item (click)="navigateToPortfolio()">
        <mat-icon>account_balance_wallet</mat-icon>
        <span>Mi Portfolio</span>
      </button>
      
      <button mat-menu-item>
        <mat-icon>settings</mat-icon>
        <span>Configuración</span>
      </button>
      
      <!-- SEPARADOR ANTES DEL LOGOUT -->
      <mat-divider></mat-divider>
      
      <!-- BOTÓN DE CERRAR SESIÓN -->
      <button mat-menu-item (click)="logout()" class="logout-item">
        <mat-icon>logout</mat-icon>
        <span>Cerrar Sesión</span>
      </button>
      
    </mat-menu>
  </div>

</mat-toolbar>
